name: format-check

on:
  pull_request:
    branches: [CSharpAPI]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Redux.slnx --verify-no-changes
