name: dotnet build

on:
  pull_request:
    branches:
      - CSharpAPI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            API.csproj
            redux-tests/redux-tests.csproj

      # A bare `dotnet build`/`test` at the repo root errors MSB1011 now that a
      # .csproj and Redux.slnx sit side by side, so name the solution explicitly.
      - name: Restore dependencies
        run: dotnet restore Redux.slnx

      # Directory.Build.targets runs `dotnet format --verify-no-changes` before
      # Build in Release/CI, so this also gates on formatting.
      - name: Build
        run: dotnet build Redux.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test Redux.slnx --no-restore --no-build --configuration Release
