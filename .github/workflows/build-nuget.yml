name: Build and Publish ISU Redux NuGet Package

on:
  push:
    branches:
      - CSharpAPI
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore library tests
        run: dotnet restore Redux.Library.Tests/Redux.Library.Tests.csproj

      - name: Test Redux library
        run: |
          dotnet test Redux.Library.Tests/Redux.Library.Tests.csproj \
            -c Release \
            --no-restore

      - name: Pack ISU.Redux.Library
        run: |
          dotnet pack Redux.Library/Redux.Library.csproj \
            -c Release \
            -p:PackageId=ISU.Redux.Library \
            -p:PackageVersion=1.1.${{ github.run_number }} \
            -o ./nupkgs

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISU-Redux-NuGet-Package-${{ github.run_number }}
          path: ./nupkgs/*.nupkg
          if-no-files-found: error

      - name: Authenticate with NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: isu-redux

      - name: Publish ISU.Redux.Library to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
