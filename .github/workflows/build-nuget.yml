name: Build Redux NuGet Package

on:
  push:
    branches:
      - CSharpAPI
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore library tests
        run: dotnet restore Redux.Library.Tests/Redux.Library.Tests.csproj

      - name: Test Redux library
        run: dotnet test Redux.Library.Tests/Redux.Library.Tests.csproj -c Release --no-restore

      - name: Pack library
        run: |
          dotnet pack Redux.Library/Redux.Library.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion=1.0.${{ github.run_number }} \
            -o ./nupkgs

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redux-NuGet-Package-${{ github.run_number }}
          path: ./nupkgs/*.nupkg
          if-no-files-found: error
