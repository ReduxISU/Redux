name: Build and Publish Redux NuGet Package

on:
  push:
    branches:
      - CSharpAPI
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Redux.Library.Tests/Redux.Library.Tests.csproj

      - name: Run library tests
        run: |
          dotnet test Redux.Library.Tests/Redux.Library.Tests.csproj \
            -c Release \
            --no-restore

      - name: Build NuGet package
        run: |
          VERSION="1.1.${{ github.run_number }}"

          dotnet pack Redux.Library/Redux.Library.csproj \
            -c Release \
            -o ./nupkgs \
            -p:PackageVersion="$VERSION"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redux-NuGet-Package
          path: ./nupkgs/*.nupkg

      - name: Authenticate with NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: prashant9711

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
