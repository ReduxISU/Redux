name: docker build and push

on:
  push:
    branches:
      - CSharpAPI

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Contributor counts are zero in the repo (see #613) and filled in here, before the image
      # is built, so the image that's built is exactly the one shipped. The token stays in these
      # workflow steps and is never passed into the Dockerfile or build args. Public repos only,
      # so the default read-only token is enough. A failure here must not block a release: the
      # image just ships with zero counts.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fill contributor counts
        id: counts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --configuration Release --project Tools/ContributorStatsSync -- --counts-only

      - name: Restore contributor file if counting failed
        if: steps.counts.outcome == 'failure'
        run: |
          echo "::warning::Contributor stats sync failed; the image ships with zero contributor counts."
          git checkout -- wwwroot/contributorInfo.json

      # Belt and braces: the file must still be valid JSON with the same entries as the
      # committed one, or the image gets the committed file instead.
      - name: Validate contributor file
        run: |
          expected=$(git show HEAD:wwwroot/contributorInfo.json | jq 'length')
          actual=$(jq 'length' wwwroot/contributorInfo.json) || actual=invalid
          if [ "$expected" != "$actual" ]; then
            echo "::warning::contributorInfo.json is invalid or has $actual entries (expected $expected); restoring the committed file with zero counts."
            git checkout -- wwwroot/contributorInfo.json
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  prune:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: redux
          package-type: container
          delete-only-untagged-versions: true

      - name: Trim old tagged versions to 10
        uses: actions/delete-package-versions@v5
        with:
          package-name: redux
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^latest$'
