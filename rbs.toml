# Redux Build System pipeline config. See github.com/ReduxISU/Redux_Build_System.
engine = "dotnet"
solution = "Redux.slnx"

[unit-test]
# The standard we're holding to. Coverage is about 85% (Oct 2026); new code needs tests to keep it above this.
coverage-min = 80

[artifact]
image = "ghcr.io/reduxisu/redux"
port = 27000
# Not /health: that answers as soon as Kestrel listens. This route's first call forces the
# reflection scan that builds the problem registry, so a 200 means genuinely warm — the same
# probe Redux_GUI's rbs.toml uses for this image.
health-path = "/Navigation/Batch/allProblems"

[integration]
# A separate project, deliberately not in Redux.slnx: `rbs unit-test` runs `dotnet test` on the
# solution, so this can never be collected without a container to talk to.
command = "dotnet test integration/Redux.Integration.csproj"
# Cold start plus the reflection scan on a CI runner.
timeout = 240

[push]
on-branch = "CSharpAPI"
