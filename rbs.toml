# Redux Build System pipeline config. See github.com/ReduxISU/Redux_Build_System.
engine = "dotnet"
solution = "Redux.slnx"

[unit-test]
# The standard we're holding to. Coverage is about 85% (Oct 2026); new code needs tests to keep it above this.
coverage-min = 80

[artifact]
image = "ghcr.io/reduxisu/redux"
port = 27000
# Served by the minimal-API route in Program.cs (#621); used once `rbs integration-test` lands.
health-path = "/health"

[push]
on-branch = "CSharpAPI"
